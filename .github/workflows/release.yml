name: Update Homebrew Formula
on:
  release:
    types: [created] # Changed from 'created' to ensure the download link is active

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v3
        with:
          # Required: Your PAT with repo permissions
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          
          # The name of the formula in your tap (martini.rb)
          formula: martini
          
          # Your tap repository
          tap: michael00kir/homebrew-martini
          
          # REMOVED: Explicit url and tag/version. 
          # The action extracts these automatically from the 'published' release event.
          force: true


