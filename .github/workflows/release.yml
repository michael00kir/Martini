name: Update Homebrew Formula
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula: martini
          tap: michael00kir/homebrew-martini
          tag: ${{ github.event.release.tag_name }}
          revision: ${{ github.sha }}
          force: true
